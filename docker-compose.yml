services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-horilla_db}
      POSTGRES_USER: ${POSTGRES_USER:-horilla_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: sh -c 'redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD}"'
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 5s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  web:
    build:
      context: .
    ports:
      - "8001:8000"
    volumes:
      - staticfiles:/app/staticfiles
      - media:/app/media
    environment:
      DEBUG: "0"
      DB_HOST: db
      DB_PORT: "5432"
      AXES_PROXY_COUNT: "1"
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?ALLOWED_HOSTS is required}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:?CSRF_TRUSTED_ORIGINS is required}
      DATABASE_URL: postgres://${POSTGRES_USER:-horilla_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-horilla_db}
      DB_INIT_PASSWORD: ${DB_INIT_PASSWORD:?DB_INIT_PASSWORD is required}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      HORILLA_TELEMETRY: "0"
      HORILLA_VERSION_CHECK: "0"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health/ || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 5
    restart: unless-stopped

  scheduler:
    build:
      context: .
    command: python manage.py run_scheduler
    volumes:
      - media:/app/media
    environment:
      DEBUG: "0"
      DB_HOST: db
      DB_PORT: "5432"
      AXES_PROXY_COUNT: "1"
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?ALLOWED_HOSTS is required}
      DATABASE_URL: postgres://${POSTGRES_USER:-horilla_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-horilla_db}
      DB_INIT_PASSWORD: ${DB_INIT_PASSWORD:?DB_INIT_PASSWORD is required}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      HORILLA_SKIP_RELEASE_TASKS: "1"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  staticfiles:
  media:
  postgres_data:
  redis_data:
