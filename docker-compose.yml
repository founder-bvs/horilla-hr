services:
  web:
    build:
      context: .
    ports:
      - "8001:8000"
    volumes:
      - staticfiles:/app/staticfiles
      - media:/app/media
    environment:
      DEBUG: "0"
      DB_HOST: db
      DB_PORT: "5432"
      AXES_PROXY_COUNT: "1"
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?ALLOWED_HOSTS is required}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:?CSRF_TRUSTED_ORIGINS is required}
      DATABASE_URL: postgres://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@db:5432/${POSTGRES_DB:?}
      DB_INIT_PASSWORD: ${DB_INIT_PASSWORD:?DB_INIT_PASSWORD is required}
      REDIS_URL: redis://:${REDIS_PASSWORD:?}@redis:6379/0
      HORILLA_TELEMETRY: ${HORILLA_TELEMETRY:-0}
      HORILLA_VERSION_CHECK: ${HORILLA_VERSION_CHECK:-0}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health/ || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 5
    restart: unless-stopped
